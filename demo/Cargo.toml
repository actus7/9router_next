[package]
name = "router-demo"
version = "0.2.0"
edition = "2021"
description = "Chat de teste para um gateway 9router (API compatível com OpenAI)"

[dependencies]
# glow (OpenGL) em vez do wgpu padrão: abre mais rápido, binário menor e
# compila metade das dependências — para uma janela de chat não há diferença
# de quadro que o wgpu compense.
eframe = { version = "0.36", default-features = false, features = [
  "glow",
  "persistence",
  "default_fonts",
  "accesskit",
  "wayland",
  "x11",
] }
# A API key vai para o cofre do sistema (Credential Manager no Windows), não
# para o arquivo de configuração em texto.
keyring = "4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TLS pelo schannel/OpenSSL do sistema em vez do rustls: o backend padrão
# arrasta o `ring`, que exige um compilador C instalado só para buildar o demo.
native-tls = "0.2"
ureq = { version = "2.12", default-features = false, features = ["json", "native-tls", "gzip"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
