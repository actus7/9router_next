# Minimal self-hosted deployment: one container, one named volume.
#
# The state that matters is NOT in the container. Since the Neon migration the
# database, the provider credentials, the API keys and the usage history all
# live in Neon Postgres, and sign-in is Neon Auth — so `DATABASE_URL`,
# `NEON_AUTH_BASE_URL` and `NEON_AUTH_COOKIE_SECRET` are required. Without them
# the container still starts and `/api/health` still answers, but every route
# that touches the database fails: see docs/DEPLOYMENT.md.
#
# The volume is still worth keeping. It holds the host-local, file-backed state
# — the Cloudflare/Tailscale tunnel, pxpipe's install, headroom's process files
# and the machine id — which is regenerated on every restart without one.
#
# Values come from a `.env` beside this file; see `.env.example`.
services:
  modelhub:
    build: .
    image: modelhub:latest
    restart: unless-stopped
    ports:
      # Bound to loopback: LAN/internet clients get connection refused, and the
      # owner's browser arrives via the localhost forwarding WSL2/Docker
      # Desktop already provide. Paired with NINEROUTER_LOOPBACK_BOUND_PORT
      # below — the two lines are one invariant. To reopen the LAN, go back to
      # "0.0.0.0:20128:20128" AND turn the flag off.
      - "127.0.0.1:20128:20128"
    volumes:
      - modelhub-data:/data
      # Optional. Bind-mount the Cursor IDE `User/globalStorage` directory from
      # the Windows host (adjust <you>) and set CURSOR_STATE_DB below to enable
      # the dashboard's "Conectar Cursor IDE" auto-detect inside the container.
      # - /mnt/c/Users/<you>/AppData/Roaming/Cursor/User/globalStorage:/cursor-global-storage:ro
    environment:
      # Must match the volume mount above.
      DATA_DIR: /data
      # Required. The POOLED Neon connection string (its host contains
      # `-pooler`): the app opens interactive transactions, which the pooled
      # endpoint supports and the HTTP one does not.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env — the app stores everything in Neon Postgres}
      # Required. Sign-in, and the account every row belongs to.
      NEON_AUTH_BASE_URL: ${NEON_AUTH_BASE_URL:?set NEON_AUTH_BASE_URL in .env — identity is Neon Auth}
      # Required. Signs the session cookie. At least 32 characters; changing it
      # signs everybody out.
      NEON_AUTH_COOKIE_SECRET: ${NEON_AUTH_COOKIE_SECRET:?set NEON_AUTH_COOKIE_SECRET in .env}
      #
      # Optional. Comma-separated hosts allowed to serve the dashboard. Empty
      # means any host; set it when the app is also reachable over a tunnel.
      DASHBOARD_ALLOWED_HOSTS: ${DASHBOARD_ALLOWED_HOSTS:-}
      #
      # Optional. Without it, provider credentials sit in the database in clear
      # text and the app warns on every boot. See docs/OPERATIONS.md.
      CREDENTIAL_KEY: ${CREDENTIAL_KEY:-}
      #
      # Refuses to boot without CREDENTIAL_KEY. Off by default so an existing
      # install that never opted in is not bricked by an upgrade.
      CREDENTIAL_ENCRYPTION_REQUIRED: ${CREDENTIAL_ENCRYPTION_REQUIRED:-}
      #
      # Optional. Full path to Cursor's `state.vscdb` as seen from inside the
      # container — the first candidate of the "Conectar Cursor IDE" auto-detect.
      # Pairs with the commented bind mount above, e.g.
      # /cursor-global-storage/state.vscdb. Empty scans the standard locations.
      CURSOR_STATE_DB: ${CURSOR_STATE_DB:-}
      #
      # Attests that the port above is bound to loopback on the host, so a
      # loopback Host header counts as local evidence for the local-only
      # routes. Defaults to on HERE only (the image default stays off); set to
      # 0 together with rebinding the port to 0.0.0.0 — one invariant, two
      # lines.
      NINEROUTER_LOOPBACK_BOUND_PORT: ${NINEROUTER_LOOPBACK_BOUND_PORT:-1}
volumes:
  modelhub-data:
