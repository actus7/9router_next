<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ModelHub Web Sessions</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <main>
    <h1>ModelHub Web Sessions</h1>
    <p id="status" role="status">Carregando…</p>
    <p id="destination"></p>
    <button id="primary" hidden></button>
    <button id="reject" class="secondary" hidden>Cancelar conexão</button>
    <button id="revoke" class="secondary">Remover autorizações do ModelHub</button>
    <p class="hint">Somente a sessão do provider escolhido é enviada ao ModelHub autorizado. Login, MFA e verificações são feitos por você no site.</p>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
