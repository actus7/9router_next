name: CI
on:
  push:
    branches: [main]
  # Every pull request, not only those targeting main. The `branches` filter
  # here meant a stacked PR — one based on another feature branch — got no CI at
  # all, so work could reach main through a chain where only the last link was
  # ever validated. The job name stays `check`, which is what main's branch
  # protection requires.
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Must satisfy package.json engines: prisma needs >=22.18.0 and
          # undici >=22.19.0. Node 20 was below both, so `npm ci` warned
          # EBADENGINE on three packages before failing.
          node-version: 22
      # Matches the npm that writes the lockfile locally.
      - run: npm install -g npm@11
      # `npm install`, not `npm ci`, and that is a known compromise.
      #
      # package-lock.json is unsatisfiable as written: `@tailwindcss/oxide-wasm32-wasi`
      # and `@img/sharp-wasm32` declare `@emnapi/core@^1.11.1` and
      # `@emnapi/runtime@^1.11.1`, and the lock carries no entry resolving either
      # at those paths. npm on Windows never installs those platform packages, so
      # it never validates their subtree and reports the lock as up to date;
      # `npm ci` on Linux validates the whole tree and refuses with
      # "Missing: @emnapi/runtime@1.11.3 from lock file".
      #
      # This predates the current work — the `check` job was already failing this
      # way on every PR. `npm install` resolves per-platform and installs
      # correctly, at the cost of the exact-version guarantee `npm ci` gives:
      # a transitive package could resolve newer here than the lock records.
      #
      # The real fix is to regenerate package-lock.json on Linux (or in a
      # throwaway container) and commit it, after which this should go back to
      # `npm ci`. Tracked in docs/KNOWN_DEBT.md.
      - run: npm install --no-audit --no-fund
      - run: npm run check
