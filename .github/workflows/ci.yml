name: CI
on:
  push:
    branches: [main]
  # Every pull request, not only those targeting main. The `branches` filter
  # here meant a stacked PR — one based on another feature branch — got no CI at
  # all, so work could reach main through a chain where only the last link was
  # ever validated. The job name stays `check`, which is what main's branch
  # protection requires.
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Must satisfy package.json engines: prisma needs >=22.18.0 and
          # undici >=22.19.0. Node 20 was below both, so `npm ci` warned
          # EBADENGINE on three packages before failing.
          node-version: 22
      # package-lock.json is written by npm 11, and npm 10 (which ships with
      # Node 22) computes a different optional-dependency tree from it — that is
      # what made `npm ci` fail with "Missing: @emnapi/... from lock file" while
      # the same command succeeds locally. Pinning the major keeps the lockfile
      # reader and writer on the same version.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run check
